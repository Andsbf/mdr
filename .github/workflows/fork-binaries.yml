# Fork only: prebuilt binaries for mdr-preview (https://github.com/Andsbf/mdr-preview).
#
# Runs on `fork-*` tags so upstream's release.yml (`v*`), which also publishes
# to crates.io, Homebrew and the rest, never fires here. Builds the same
# targets as release.yml and attaches them with a SHA256SUMS file, whose
# hashes mdr-preview pins.
name: Fork binaries

on:
  push:
    tags:
      - 'fork-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mdr
            archive: mdr-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mdr
            archive: mdr-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mdr
            archive: mdr-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: mdr
            archive: mdr-aarch64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mdr.exe
            archive: mdr-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libgl1-mesa-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # The binary mdr-preview runs must answer --export html --allow-connect;
      # checked here so a broken archive never reaches a release. Cross-built
      # x86_64 macOS runs too, under Rosetta.
      - name: Smoke test
        shell: bash
        run: |
          page=$(echo '# Hi' | target/${{ matrix.target }}/release/${{ matrix.binary }} --export html --allow-connect -)
          grep -q "connect-src 'self'" <<<"$page"
          grep -q '<h1 id="hi">Hi</h1>' <<<"$page"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }} LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE "target/${{ matrix.target }}/release/"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}", "target/${{ matrix.target }}/release/LICENSE" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum mdr-* | tee SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Fork build for [mdr-preview](https://github.com/Andsbf/mdr-preview): upstream mdr plus CleverCloud/mdr#77, #78 and #79 (\`--export html --allow-connect\`). Built from ${GITHUB_SHA}."
